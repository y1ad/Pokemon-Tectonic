plugins {
    id 'com.android.application'
}

archivesBaseName = "tectonic-android"

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        applicationId "com.y1ad.tectonic"
        minSdk 23
        targetSdk 33
        versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
        versionName(System.getenv("APP_VERSION_NAME") ?: "dev")

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // El APK final lo firma el workflow (apksigner) tras inyectar game.zip
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
