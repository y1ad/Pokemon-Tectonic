name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (empty = 0.<run number>)"
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_REPO: y1ad/mkxp-z-android-reworked
  NDK_VERSION: 23.2.8568313
  APP_VERSION_NAME: ${{ inputs.version_name || format('0.{0}', github.run_number) }}
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Compilar datos del juego (PBS + plugins) y empaquetar game.zip
  # ---------------------------------------------------------------------------
  game-data:
    name: Compile game data & pack
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true

      - uses: actions/checkout@v4

      - name: Install headless runtime
        run: |
          sudo apt-get update -y
          for p in xvfb zip unzip libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 \
                   libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0 libvorbisfile3 \
                   libtheora0 libphysfs1 libpixman-1-0 libuchardet0 libfluidsynth3 libssl3; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "::warning::could not install $p"
          done

      - name: Compile PBS + plugins (headless, Linux build from the repo)
        id: compile
        continue-on-error: true
        run: bash android/scripts/compile_game_data.sh "$PWD"

      - name: Report compile outcome
        run: |
          echo "headless compile outcome: ${{ steps.compile.outcome }}"
          echo "### Headless compile: ${{ steps.compile.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          ls -la Data/*.dat Data/PluginScripts.rxdata 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pack game.zip
        env:
          GAME_VERSION: ${{ github.sha }}-${{ steps.compile.outcome }}
        run: bash android/scripts/make_game_zip.sh "$PWD" "$RUNNER_TEMP/game.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: game-zip
          path: ${{ runner.temp }}/game.zip
          compression-level: 0
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2) Motor mkxp-z para Android (arm64-v8a) -> APK sin juego
  # ---------------------------------------------------------------------------
  engine:
    name: Build engine APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout port files
        uses: actions/checkout@v4
        with:
          sparse-checkout: android
          path: port

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          path: engine
          submodules: recursive

      - name: Apply Tectonic overlay
        run: bash port/android/scripts/apply_overlay.sh engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake curl wget gpg xxd autoconf automake \
            autoconf-archive libtool pkg-config python3 git unzip autopoint gettext xutils-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      # El runner ya trae el Android SDK; se usa sdkmanager directamente
      # (android-actions/setup-android fallaba en este paso).
      - name: Install NDK + build-tools
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          ls "$SDK" || true
          ls "$SDK/cmdline-tools" || true
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "ndk;${NDK_VERSION}" "platforms;android-33" "build-tools;33.0.2"
          NDK="$SDK/ndk/${NDK_VERSION}"
          test -d "$NDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Restore native deps cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/app/jni/build-arm64-v8a
            engine/app/jni/libogg
            engine/app/jni/libvorbis
            engine/app/jni/libtheora
            engine/app/jni/libiconv
            engine/app/jni/uchardet
            engine/app/jni/pixman
            engine/app/jni/physfs
            engine/app/jni/openal
            engine/app/jni/SDL2
            engine/app/jni/SDL2_image
            engine/app/jni/SDL2_ttf
            engine/app/jni/SDL2_sound
            engine/app/jni/openssl
            engine/app/jni/ruby
          key: native-${{ env.NDK_VERSION }}-${{ hashFiles('engine/app/jni/Makefile', 'engine/app/jni/get_deps.sh') }}

      - name: Download JNI dependencies + generate xxd
        working-directory: engine/app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      - name: Build native dependencies (arm64-v8a)
        working-directory: engine/app/jni
        env:
          ARCH: linux-x86_64
          HOST: aarch64-linux-android
          TARGET: aarch64-linux-android
          ABI: arm64-v8a
        run: make -j"$(nproc)"

      - name: Save native deps cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            engine/app/jni/build-arm64-v8a
            engine/app/jni/libogg
            engine/app/jni/libvorbis
            engine/app/jni/libtheora
            engine/app/jni/libiconv
            engine/app/jni/uchardet
            engine/app/jni/pixman
            engine/app/jni/physfs
            engine/app/jni/openal
            engine/app/jni/SDL2
            engine/app/jni/SDL2_image
            engine/app/jni/SDL2_ttf
            engine/app/jni/SDL2_sound
            engine/app/jni/openssl
            engine/app/jni/ruby
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('port/android/overlay/*.gradle', 'port/android/overlay/gradle-wrapper.properties') }}

      - name: Build release APK (engine only, unsigned)
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find engine/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Engine APK: $APK"
          cp "$APK" out/engine.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: engine-apk
          path: out/engine.apk
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 3) Inyectar juego, alinear, firmar y publicar
  # ---------------------------------------------------------------------------
  package:
    name: Package, sign & release
    needs: [game-data, engine]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/download-artifact@v4
        with:
          name: game-zip
          path: dl

      - uses: actions/download-artifact@v4
        with:
          name: engine-apk
          path: dl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Inject game, zipalign and sign
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          mkdir -p stage/assets out
          cp dl/game.zip stage/assets/game.zip
          cp dl/engine.apk stage/app.apk
          (cd stage && zip -q -0 app.apk assets/game.zip)
          "$BT/zipalign" -f -p 4 stage/app.apk stage/aligned.apk

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > stage/release.jks
            ALIAS="$KEY_ALIAS"; SP="$STORE_PASSWORD"; KP="${KEY_PASSWORD:-$STORE_PASSWORD}"
          else
            echo "::warning::No signing secrets: using a throwaway key. Updates over a previous install will require uninstalling first. See android/README.md"
            keytool -genkeypair -keystore stage/release.jks -alias tectonic -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass tectonic -keypass tectonic -dname "CN=Pokemon Tectonic Android"
            ALIAS=tectonic; SP=tectonic; KP=tectonic
          fi

          OUT="out/PokemonTectonic-${APP_VERSION_NAME}.apk"
          "$BT/apksigner" sign --ks stage/release.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SP" --key-pass "pass:$KP" --out "$OUT" stage/aligned.apk
          "$BT/apksigner" verify --verbose "$OUT" | head -n 8
          ls -lh out

          SIZE=$(stat -c %s "$OUT")
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::warning::APK is >= 2 GiB; GitHub Releases will reject it. Use the workflow artifact instead."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonTectonic-apk
          path: out/*.apk
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && env.APK_SIZE < 2147483648 }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('android-v{0}', env.APP_VERSION_NAME) }}
          name: Pokémon Tectonic Android ${{ env.APP_VERSION_NAME }}
          files: out/*.apk
          body: |
            Pokémon Tectonic — Android APK (arm64-v8a), build from `${{ github.sha }}`.

            **Instalación**
            1. Descarga el APK e instálalo (activa *instalar apps desconocidas*).
            2. El primer arranque extrae el juego (~1.3 GB). Necesitas ~4 GB libres.
            3. Controles táctiles en pantalla; también funciona con mando Bluetooth/USB.

            Si no hay secrets de firma configurados, la clave es desechable: desinstala antes de actualizar.
